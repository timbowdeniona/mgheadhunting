<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MG Headhunting Form Endpoint</title>
  </head>
  <body>
    <!-- Netlify Forms detection form — do not remove -->
    <form
      name="initiate-search-mandate"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="initiate-search-mandate" />
      <input name="bot-field" />
      <input name="name" />
      <input name="roleTitle" />
      <input name="company" />
      <input name="email" />
      <input name="phone" />
      <input name="targetLevel" />
      <input name="sectorSpecialism" />
      <input name="timeframe" />
      <textarea name="notes"></textarea>
    </form>
  </body>
</html>
